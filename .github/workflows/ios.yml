name: iPhone app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      # WireGuardKit's Go half is built with Go during the Xcode build. Its pinned golang.org/x/net
      # links to syscall internals that Go 1.23 refuses ("invalid reference to syscall.recvmsg"), so 1.22.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - run: brew install xcodegen
      - run: xcodegen generate
      # Packages go in DerivedData/SourcePackages, where the WireGuardGoBridge target looks for them.
      - run: xcodebuild -resolvePackageDependencies -project Hermai.xcodeproj -scheme Hermai -derivedDataPath build/DerivedData
      - run: ./patch-wireguardkit.sh build/DerivedData
      # A compile check without signing; signing and TestFlight come with Kayla's App Store Connect key.
      - run: >
          xcodebuild build -project Hermai.xcodeproj -scheme Hermai
          -destination 'generic/platform=iOS' -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          > build.log 2>&1
          || { awk '/^ExternalBuildToolExecution/,/^$/' build.log | grep -vE '^    export ' | tail -120;
               grep -E 'error|fatal|go: ' build.log | grep -v ' -x c ' | head -60; exit 1; }
        shell: bash
